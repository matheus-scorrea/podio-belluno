services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metas
      POSTGRES_USER: metas
      POSTGRES_PASSWORD: metas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metas -d metas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      - /dev/ppp
    depends_on:
      db:
        condition: service_healthy
    # Seed só na primeira vez: docker compose exec backend php artisan migrate --seed
    command: ["sh", "-c", "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"]
    environment:
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: metas
      DB_USERNAME: metas
      DB_PASSWORD: metas
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost:8000,127.0.0.1:8000
      DW_CONNECTION: ${DW_CONNECTION:-mysql}
      DW_HOST: ${DW_HOST:-}
      DW_PORT: ${DW_PORT:-3306}
      DW_DATABASE: ${DW_DATABASE:-warehouse}
      DW_USERNAME: ${DW_USERNAME:-readonly}
      DW_PASSWORD: ${DW_PASSWORD:-}

  scheduler:
    build: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      - /dev/ppp
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: metas
      DB_USERNAME: metas
      DB_PASSWORD: metas
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      DW_CONNECTION: ${DW_CONNECTION:-mysql}
      DW_HOST: ${DW_HOST:-}
      DW_PORT: ${DW_PORT:-3306}
      DW_DATABASE: ${DW_DATABASE:-warehouse}
      DW_USERNAME: ${DW_USERNAME:-readonly}
      DW_PASSWORD: ${DW_PASSWORD:-}

volumes:
  pgdata:
